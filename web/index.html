<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>GoInspector - Created with love by Bedo</title>
    <script src="wasm_exec.js"></script>
    <style>
      body,html { margin:0; background:#000; overflow:hidden; }
      canvas { width:100vw; height:100vh; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script>
      const go = new Go();
      WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject)
        .then(result => go.run(result.instance));
    </script>
  </body>
</html>
